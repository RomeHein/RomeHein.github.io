<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Romain Cayzac — Engineer V2X</title>
<meta name="description" content="Romain Cayzac: mobile projects, AI, software development and maker projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- Styles, in cascade order -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/faces/ai.css">
<link rel="stylesheet" href="css/faces/mobile.css">
<link rel="stylesheet" href="css/faces/maker.css">
<link rel="stylesheet" href="css/faces/software.css">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/tower.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/responsive.css">

<!-- Scripts: plain scripts sharing one global scope. `defer` downloads them in parallel
     while the page is parsed, then runs them in this order; main.js boots the scene. -->
<script defer src="js/content.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/math.js"></script>
<script defer src="js/pcb-data.js"></script>
<script defer src="js/parts.js"></script>
<script defer src="js/board.js"></script>
<script defer src="js/tower.js"></script>
<script defer src="js/faces/ai.js"></script>
<script defer src="js/faces/mobile.js"></script>
<script defer src="js/faces/rabbit.js"></script>
<script defer src="js/faces/software.js"></script>
<script defer src="js/faces/maker.js"></script>
<script defer src="js/faces/maker-rabbit.js"></script>
<script defer src="js/background.js"></script>
<script defer src="js/intro.js"></script>
<script defer src="js/panel.js"></script>
<script defer src="js/orientation.js"></script>
<script defer src="js/main.js"></script>
</head>
<body class="intro">
<div class="stage" id="stage">
  <div class="canvas" id="canvas">
    <div class="world" id="world">

      <div class="cam tower-cam" aria-hidden="false">
        <div class="rig tower" id="tower">
          <div class="face side f-left" id="towerLeft"></div>
          <div class="face side f-front"></div>
          <div class="face top" id="towerTop"></div>
        </div>
      </div>

      <div class="cube-fade">
      <div class="cam cube-cam">
        <div class="rig cube" id="cube">
          <div class="face cf bottom" data-face="bottom"></div>
          <div class="face cf side f-front" data-face="front"></div>
          <div class="aigroup" id="aiGroup"></div>
          <div class="mobgroup" id="mobGroup"></div>
          <div class="makgroup" id="makGroup"></div>
          <div class="swgroup" id="swGroup"></div>
          <div class="face cf side f-right" data-face="right"></div>
          <div class="face cf side f-back"  data-face="back"></div>
          <div class="face cf side f-left"  data-face="left"></div>
          <div class="face cf top" id="board" data-face="top"></div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="p-head"><span id="pPart">RC-BOARD V2X</span><span class="st"><span class="dot"></span><span id="pState">standby</span></span></div>
    <div class="p-scroll"><div class="p-body" id="pBody"></div></div>
    <div class="p-foot">
      <div class="sw-row" id="swRow" role="group" aria-label="Modules"></div>
      <div class="p-meta">
        <span class="keys">Keys 1–4, ← →, Esc</span>
        <span class="m-socials" id="mSocials"></span>
        <button class="linkbtn" id="homeBtn" type="button">Overview</button>
      </div>
    </div>
  </aside>
</div>
</body>
</html>
